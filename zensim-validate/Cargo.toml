[package]
name = "zensim-validate"
version = "0.1.0"
edition = "2024"
description = "Validation harness: correlate zensim against human quality ratings"
license = "MIT"
publish = false

[features]
default = []

# GPU trainer dispatch (task #166). When enabled, `zensim_mlp_train`
# accepts `--gpu-runtime cuda` and routes the per-sample-α head training
# loop through `zensim-train-gpu`. Off by default so the existing CPU
# code path stays bit-identical and machines without CUDA can still
# build the validate crate.
gpu-cuda = ["zensim-train-gpu/gpu-cuda"]
gpu-wgpu = ["zensim-train-gpu/gpu-wgpu"]
gpu-cpu  = ["zensim-train-gpu/gpu-cpu"]

# featcanon MEASUREMENT arithmetic for `tier_audit_features` only:
# `ZENSIM_FEATCANON=exact|c32|c64|neum|off` and the f64 exact-oracle bodies
# exist only in a zensim built with `oracle` (a ruler, not semantics).
featcanon-oracle = ["zensim/oracle"]

[dependencies]
# `corruption-head`: the ZCTH evaluator + the ONE owner of the deploy
# composition, which `bake_verdict` and `corrhead_parity` both consume
# rather than re-implementing (docs/PLAN_CORRHEAD_SERVING_2026-09-06.md).
zensim = { path = "../zensim", features = ["training", "corruption-head"] }
zensim-experimental = { path = "../zensim-experimental" }
zensim-train-core = { path = "../zensim-train-core" }
zensim-train-gpu = { path = "../zensim-train-gpu" }
zenpredict = { workspace = true }
zenpredict-bake = { workspace = true }
zenstats = { workspace = true }
archmage = { workspace = true }
magetypes = { workspace = true }
image = { workspace = true }
rayon = { workspace = true }
csv = "1"
calamine = "0.34"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
glob = "0.3"
# `freeze_check --select --seed-group` (2026-09-04 owner-fix): the seed-group
# id is sha1(normalized argv)[:12], byte-identical to the board's owner
# (`scripts/v_next/gauntlet.py::seed_group_key`) so a `--select` group and a
# board group are THE SAME handle, not two handles that happen to partition
# the same way. sha1 is fixed by that parity requirement, not chosen: the
# board's ids are already recorded in `benchmarks/fairness_tiers_2026-09-04
# .pointer.md` under a sha256, so switching the board to another digest would
# invalidate a committed record. Same RustCrypto generation as the `sha2`
# dependency above, so the `Digest` trait versions align.
sha1 = "0.11.0"
anyhow = "1"
memmap2 = "0.9.10"
memchr = "2.8.0"
fast-float2 = "0.2.3"
parquet = { version = "59.1.0", default-features = false, features = ["arrow", "zstd"] }
arrow = { version = "59.1.0", default-features = false }
# --manifest reproduce-this input mode for zensim_mlp_train (train_manifest.rs).
toml = "1.1.2"
serde = { version = "1.0.228", features = ["derive"] }
# `float_roundtrip`: serde_json's DEFAULT float parser is not correctly
# rounded — it can land one ULP off the value the text names. That silently
# broke the G-ADDR floor registry (a bar written as the shipped dial's own
# `99.98330778475787` parsed back as `…788`, so the reference bake failed its
# own bar by one ULP). Every bar in that registry is an exact measurement of a
# shipped artifact and must round-trip bit-for-bit, so the accurate parser is
# mandatory here. It only affects PARSING (serialization already goes through
# ryu, which is shortest-round-trip), so nothing this crate writes changes.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.11.0"
# npz (zip-of-npy) reading for `bake_dial_refit fit-lasso` — DEFLATE inflate
# only, via our own pure-Rust DEFLATE crate (no external zip/npy deps).
zenflate = "0.4.0"
# Native content-admission mode; the legacy audit remains available for replay.
zenpng = { workspace = true }
# hdrvid_extract: HDR-VDC dimming shader (ST 2084 decode / 8 / re-encode) and
# the PQ code-value image source handed to the native HDR walk.
linear-srgb = { workspace = true, features = ["transfer"] }
bytemuck = { workspace = true }
zenexr ={ git = "https://github.com/imazen/zenextras", rev = "109a9ec367278a93751f7701f8536358e5d3f5cd" }
zenpixels = { workspace = true }
zenresize = { workspace = true }
zenpixels-convert = { version = ">=0.3.1, <0.4.0", default-features = false }
enough = { workspace = true }

[dev-dependencies]
zenbench = { workspace = true }
iai-callgrind = "0.16.1"

[[bench]]
name = "adam_bench"
path = "benches/adam_bench.rs"
harness = false

[[bench]]
name = "bench_mlp_kernels"
path = "benches/bench_mlp_kernels.rs"
harness = false

[[bench]]
name = "optmlp_iai"
path = "benches/optmlp_iai.rs"
harness = false

[[bench]]
name = "fusedstep_iai"
path = "benches/fusedstep_iai.rs"
harness = false

[[bench]]
name = "gl_step_timing"
path = "benches/gl_step_timing.rs"
harness = false

[[bench]]
name = "projection_rows"
path = "benches/projection_rows.rs"
harness = false
