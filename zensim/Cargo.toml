[package]
name = "zensim"
version = "0.3.0"
edition = "2024"
description = "Fast psychovisual image similarity metric"
repository = "https://github.com/imazen/zensimx"
# Research copy: the published crate is released from imazen/zensim (2026-10-28 split).
publish = false
license = "MIT OR Apache-2.0"
readme = "../README.crates.md"
rust-version = "1.93.0"
keywords = ["image", "quality", "ssim", "perceptual", "similarity"]
categories = ["multimedia::images", "computer-vision"]
# Ship source and the bakes embedded by `profile.rs`, including the Rev5
# diff+frag-820 SDR default B, BHdr and the feature-gated named profiles.
# Retired B artifacts remain for explicit historical regression/reproduction.
# The rest of `weights/` (archive bakes, picker checkpoints, historical/
# experimental bakes, other manifests) stays on disk for the workspace's
# research tooling but is NOT shipped to crates.io — every experimental bake
# now lives in the unpublished `zensim-experimental` crate. `Cargo.toml`, the
# `readme`, and license metadata are always included.
# GATED by `serving::tests::every_included_bake_is_packaged` — every
# `include_bytes!("../weights/…")` in `src/` must appear below, or the
# PUBLISHED crate does not compile. It did not, between 2026-08-29 and
# 2026-09-06: `cb2f412d` pointed A/B/BHdr/D at the four `*_byid_*` bakes and
# `c_sdr_purity944` / `c_hdr_l1t1944` replaced `c_sdr_mlp944_corrmix`, and this
# list moved with neither. `cargo package --list` showed the six missing files.
include = [
    "src/**/*.rs",
    # SERVED bakes — `include_bytes!`ed by `profile.rs` outside `cfg(test)`.
    "weights/v47_strict_qat_native_byid_2026-09-06.bin",
    "weights/b_sdr_diff_frag_820_rev5_2026-10-19.bin",
    "weights/b_sdr_linear_cid80_inclwinsor_dense_dial_byid_2026-09-06.bin",
    "weights/bhdr_linear_shaped_cvvdpmix_byid_2026-09-06.bin",
    "weights/d_sdr_add156_id100_negrich_dial_byid_2026-09-06.bin",
    "weights/c_sdr_purity944_byid_2026-09-07.bin",
    "weights/c_sdr_purity944_2026-08-29.bin",
    "weights/c_hdr_l1t1944_byid_2026-09-07.bin",
    "weights/c_hdr_l1t1944_2026-08-29.bin",
    # RETIRED pre-densify bytes: `include_bytes!`ed by the `cfg(test)` flip
    # gate, and by the `ProfileParams::builder` doctest. `cargo test` on a
    # packaged crate has to work, so they ship.
    "weights/v47_strict_qat_native_2026-05-27.bin",
    "weights/b_sdr_linear_cid80_inclwinsor_dense_dial_2026-07-07.bin",
    "weights/bhdr_linear_shaped_cvvdpmix_2026-07-12.bin",
    "weights/d_sdr_add156_id100_negrich_dial_2026-09-05.bin",
    # The raw pre-guard B ensemble, so downstream can byte-reproduce B via
    # `scripts/reproduce_b.sh`. Not `include_bytes!`ed.
    "weights/b_sdr_linear_cid80_anchored_2026-07-04.bin",
    "weights/manifests/v47_strict_qat.toml",
    "weights/manifests/b_sdr_diff_frag_820_rev5_2026-10-19.toml",
]

[package.metadata.docs.rs]
# Document the full opt-in surface (training / classification / zenpixels /
# custom-profiles). Default-feature docs would hide those APIs.
all-features = true

[features]
default = ["avx512", "imgref", "threads", "deprecated-profiles", "candidate-profiles", "feature-regime-v2"]
avx512 = ["archmage/avx512", "magetypes/avx512"]
## Diagnostic ONLY: accumulate `Σ activity` during extraction so `ScaleStats::
## iw_mean_w` reports the factor the `1/n`-pooled `iw_*` features carry (they
## should be pooled `1/Σw`; see benchmarks/iw_pooling_normalization_2026-07-15.md).
## COST: NOT RESOLVED. An ad-hoc A/B first read +2.8% (23.01 vs 22.38 ms at
## 1024x1024), but repeating it 3x each gave OFF 23.42/27.68/29.68 and ON
## 27.00/28.78/23.64 — fully overlapping. That first number was noise, and the
## harness was the exact back-to-back-timing bias zenbench exists to kill. A
## paired zenbench run would be needed to resolve it. Gated anyway: OFF is
## zero-cost BY CONSTRUCTION, which beats an unmeasured cost, and the question
## it answers is settled (the pooling factor is a uniform 1.03-1.27x, too small
## to justify a re-extract). Default OFF. Adds only a sum; it CANNOT change any
## feature value, so on/off builds produce identical bakes.
iw-diagnostics = []
## The companion CORRUPTION HEAD: a gradient-boosted tree ensemble in its own
## `ZCTH` wire format (`zensim::corruption_head`), plus the one owner of the
## deploy composition. NOT default: `Zensim::compute` never runs it, and the
## public API delta on a default build is zero. V4 admission validation uses
## optional JSON/SHA dependencies only when this feature is enabled.
## Design: `docs/PLAN_CORRHEAD_SERVING_2026-09-06.md`.
corruption-head = ["dep:serde_json", "dep:sha2"]
## TEST-ONLY scalar oracle for the pooled-feature math (`feature_v2::oracle`):
## an L1 Neumaier-compensated reference plus an L2 EXACT Shewchuk-expansion
## accumulator, used as ground truth for the era-2 error bounds
## (`benchmarks/era2_perf_break_2026-08-31.md` §11). Automatically available
## under `cfg(test)`; this feature exists so benches and fuzz targets OUTSIDE
## `cfg(test)` can reach it. NEVER enable in a product build — it is a ruler,
## not semantics.
oracle = []
## DIAGNOSTIC ONLY: let a bake be scored against pixels from a DIFFERENT
## arithmetic revision, so an existing candidate can be replayed on a corrected
## extraction BEFORE it has been refit (issue #61's "run the existing candidate
## surface on the corrected path before new fitting").
##
## Compile-gated rather than env-gated on purpose: a product build does not
## CONTAIN the bypass, so no environment can turn it on. Enabling the feature is
## still not enough — `ZENSIM_CROSS_REVISION_DIAGNOSTIC=1` must also be set, and
## every affected call prints a stderr warning naming both revisions. A number
## produced this way is a cross-era diagnostic, never a served score: the
## coefficients were fit against one extractor and the pixels came from another.
## NEVER enable in a product build. Same standing as `oracle` — a ruler, not
## semantics.
cross-revision-diagnostic = []
## Enable multi-threaded computation via rayon. Disable for wasm or single-threaded use.
threads = ["dep:rayon"]
## Exposes training/research API: ZensimConfig, try_score_from_features,
## WEIGHTS, FEATURES_PER_SCALE. These items control metric internals (blur
## kernel, scale count) whose outputs are incomparable with the default
## trained weights.
training = []
## Exposes classification API: classify(), ClassifiedResult, ErrorClassification,
## DeltaStats, AlphaStratifiedStats. Used by zensim-regress for regression testing.
classification = []
## Enable ImageSource impls for imgref::ImgRef<Rgb<u8>> and ImgRef<Rgba<u8>>.
imgref = ["dep:imgref", "dep:rgb"]
## Enable ImageSource adapter for zenpixels PixelSlice/PixelBuffer types.
## Automatically maps PixelDescriptor to correct format, alpha mode, and
## color primaries. Handles RGBX/BGRX (automatic opaque) and premultiplied
## alpha (un-premultiplied on the fly).
zenpixels = ["dep:zenpixels"]
## Enable the 80 MP OOM-relief integration test (`streaming_strips_oom_80mp`).
## Off by default because the test allocates ~500 MB of input pixels which
## is disruptive in default `cargo test --all` runs.
streaming_strips_oom = []
## Exposes the custom-profile extension point: `ZensimProfile::Custom`,
## `ProfileParams::builder()`, and `ProfileParamsBuilder`. Off by default —
## the `zensim-experimental` crate enables it to rebuild the historical
## research profiles; default consumers don't carry this surface.
custom-profiles = []
## Carries the DEPRECATED generation-A profile (`ZensimProfile::A`, the v47
## MLP codec-target bake). ON by default so existing code keeps compiling and
## `A` stays selectable — but `A` is `#[deprecated]`: new code should use
## `ZensimProfile::codec_target()` / `latest_preview()` (both now return the
## current B profile) or name `ZensimProfile::B` directly.
## Disable via `--no-default-features` (re-add the other defaults you need) to
## drop `A` and its ~27 KB MLP bake entirely. A future minor release may move
## this feature out of `default`; migrate off `A` now.
deprecated-profiles = []
# Generation-C candidate profiles (C = 149 KB SDR MLP, CHdr = 180 KB HDR MLP)
# plus `D`.
# ON by default; size-sensitive builds drop them (`--no-default-features` +
# re-add what you need) to save ~329 KB of embedded bake bytes — the same
# opt-out shape as `deprecated-profiles` (A's ~27 KB v47 bake).
#
# **Requires `feature-regime-v2`, since 2026-09-06, because these profiles
# cannot be SERVED without it.** `C` / `CHdr` declare a 944-wide caller vector
# and only the v2 walk emits 944 — without it `Zensim::new(C).compute(..)`
# returned `ModelForwardFailed` on every call ("bake declares more input
# features than the caller supplied"), i.e. the feature shipped a profile the
# build could not serve. `D`'s whole reason to exist is the fold engine, which
# is also behind that feature (`benchmarks/profile_d_notax_2026-09-01.md`), so
# the dependency is the honest statement of what this feature needs rather
# than an incidental coupling. A feature that ships a variant must ship what
# serves it.
candidate-profiles = ["feature-regime-v2"]
## Exposes the "bounded" v2 research API (`feature_v2` module,
## `Zensim::compute_v2_features`, `FeatureViewV2`) AND the streaming fold
## engine it carries (`fold_engine.rs`, `benchmarks/fold_engine_2026-08-31.md`)
## — **ON by default since 2026-09-01** (the Profile-D no-tax refactor,
## `benchmarks/profile_d_notax_2026-09-01.md`). STRICTLY ADDITIVE — the
## default v1 372-feature extraction (`metric.rs`, `streaming.rs`) is byte-frozen
## and unaffected whether this feature is on or off; every canonical parquet and
## shipped bake depends on that freeze. v2 redesigns every feature to be
## BOUNDED (saturating/GMSD-style similarity forms, never a raw ratio),
## NORMALIZED (one weighted-mean convention, `WeightedPool::mean`, used for
## masked/IW/soft-peak alike), and SPATIALIZABLE (every feature is a mean of an
## explicit per-pixel map — including the deviation/"peak" signals that v1's
## max/L8 pooling could not express as a per-pixel map). See
## `docs/FEATURE_V2_SPEC_2026-07-18.md` for the full defect inventory (D1-D9),
## design principles, and per-feature formula/bound/citation table.
##
## **Why default-on now.** The v2 module also carries the FUSED, SIMD-dispatched
## streaming fold (`foldapp_streaming_walk` + `V1PoolsMode` + `V1FreeExtras`),
## which is `zensim`'s FASTEST walk for the v1-basic(+peaks/free) class of
## bake (`ZensimProfile::D`) — since option C (2026-08-30) the fold's `f0..372`
## is bit-identical to v1's own 372-feature extraction at every width
## (`v1_372_bit_exact_to_fold_at_every_width`). Before this flip, that speed
## was reachable only behind this explicit opt-in feature, so `D`'s "whole
## reason to exist is speed" silently fell back to the buffered (B-class-cost)
## walk on any plain `cargo add zensim` build — the W7 gap this flip closes.
## The stale "off by default: a scalar reference impl, not for production
## throughput" framing that used to sit here described iteration 1 (pre-fusion,
## 2026-07-18); it stopped being true once the fused/SIMD fold landed and is
## corrected here rather than left to mislead the next reader. Adds no new
## dependency (`= []`); the cost is compiled code size / build time, not a
## runtime behavior change for any profile other than `D` (every other profile
## still defaults to the buffered walk — see `Zensim::new`'s `fast_by_default`).
## Disable via `--no-default-features` (re-add the other defaults you need) if
## the extra compiled surface is unwanted and `D`'s buffered-speed fallback is
## acceptable.
feature-regime-v2 = []

[dependencies]
archmage = { workspace = true }
bytemuck = { workspace = true }
magetypes = { workspace = true }
libm = { workspace = true }
rayon = { workspace = true, optional = true }
thiserror = { workspace = true }
linear-srgb = { workspace = true }
imgref = { workspace = true, optional = true }
rgb = { workspace = true, optional = true }
zenpixels = { version = ">=0.2.11, <0.4.0", default-features = false, features = ["std"], optional = true }
# Runtime for the `PreviewV0_3` MLP scorer. zenpredict is MIT/Apache-2.0
# (matching zensim), so the runtime dep is unconditional in 0.3.0+.
# Prior comments claiming AGPL referred to a license plan that was
# superseded before zenpredict's 0.1.0 publish.
zenpredict = { workspace = true }
# Cooperative cancellation (issue #48): the `Stop` trait is part of the
# public API (`Zensim::with_stop`, `ZensimError::Cancelled`).
enough = { workspace = true }
zenresize = { workspace = true }
serde_json = { version = "1.0.151", optional = true }
sha2 = { version = "0.11.0", optional = true }

[dev-dependencies]
# jxl-encoder-family perceptual diffmap, for the RD block-selection comparison
# (rd_block_selection example). Matches the version zenavif deploys.
butteraugli = "0.9.3"
# The OPPONENT in `benches/extract_paths_bench.rs`'s `fast_ssim2` arm — the
# speed row of the ssim2-replacement exam wants ssim2 interleaved with the
# zensim walks in ONE zenbench group, not measured in a separate process.
# Dev-dep only: no effect on the published dependency graph. Default features
# (no `rayon`) = what a consumer gets; the threaded variant is priced by
# `zensim-bench`'s `ssim2_speed_bar` bench under its `ssim2-rayon` feature.
fast-ssim2 = { version = "0.8.2", default-features = false, features = ["imgref"] }
imgref = { workspace = true }
image = { workspace = true }
archmage = { workspace = true, features = ["testable_dispatch"] }
serde_json = "1"
serde = { version = "1.0.229", features = ["derive"] }
# Synthetic wide-bake fixtures for `ComputeSet::from_block_profile`'s
# free-set-vs-genuine-v2-era gate tests (feature_v2.rs) — the mandated JSON
# pipeline (CLAUDE.md "JSON pipeline mandate for ZNPR v3 bakes"), not a
# hand-rolled wire-format emitter. Dev-dep only: no effect on the published
# dependency graph. Real A3b/A4b/K-class campaign bakes are 500 KB+ external
# artifacts under /mnt/v — too large to commit and not CI-portable, so the
# committed gate builds a minimal synthetic 944-wide model with the same
# structural shape instead.
zenpredict-bake = { workspace = true }
# Phase-2 (feature-v2b) tooling: decode/resize/re-encode real corpus images
# through zen* crates instead of the `image` crate, per project convention
# (image::open/imageops::resize are only kept above for the pre-existing
# examples that already used them; new example/bench tooling uses these).
zenpng = { workspace = true }
zenpixels = { workspace = true }
# E36 example ingress uses native named-profile conversion and white compositing.
zenpixels-convert = { version = "0.2.16", default-features = false, features = ["std"] }
zencodec = { version = "0.1.26", default-features = false }
# `zenpng`'s encode entry points all take `imgref::ImgRef<rgb::Rgb<u8>>`, so
# example tooling that WRITES a PNG (`zen_io::encode_png_rgb8`, used by the
# `diffmap_heatmap` demo) needs `rgb` by name. It is already a non-dev
# dependency behind the default-on `imgref` feature; listing it here too keeps
# the examples building under any feature combination.
rgb = { workspace = true }
zenjpeg = { version = "0.8.4", default-features = false, features = ["decoder"] }
# Pins the shipped Profile C weight bytes (profile_c_tests::weight_sha256_pinned).
# Same version zensim-validate already uses in this workspace.
sha2 = "0.11.0"

[lints.clippy]
uninlined_format_args = "allow"
too_many_arguments = "allow"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(feature, values("training", "imgref", "classification", "zenpixels", "threads", "streaming_strips_oom", "custom-profiles", "feature-regime-v2"))', 'cfg(gmsbank_calibration_instrument)', 'cfg(restore_cuts_instrument)', 'cfg(steerfix_instrument)']

[dev-dependencies.zenbench]
workspace = true

