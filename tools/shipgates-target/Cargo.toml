[package]
name = "shipgates-target"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
zensim-target = { path = "../../zensim-target", default-features = false, features = ["native-probe"] }
zensim = { path = "../../zensim", features = ["custom-profiles", "imgref"] }
zenpredict = { git = "https://github.com/imazen/zenanalyze", rev = "9f57f1be05e49f91d7a13f5a4bc1227b56fe76f2" }
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "33ef549f0ba8daf1ab2bdce6bf75363807d87636", default-features = false, features = ["recompress-expert"] }
zenwebp = { git = "https://github.com/imazen/zenwebp", rev = "256c056441aeeb5e8cb275d5d5140508f1f54e4f", default-features = false, features = ["std"] }
zenavif = { git = "https://github.com/imazen/zenavif", rev = "bf7fdadc95c357571bbd4a245194880912602fd7", default-features = false }
bytemuck = "1.25.2"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
image = { version = "0.25.10", default-features = false, features = ["png"] }
enough = "0.4.5"
almost-enough = "0.4.5"
zenpixels = { version = ">=0.3.1, <0.4.0", default-features = false }

[patch.crates-io]
zencodec = { git = "https://github.com/imazen/zencodec", rev = "1816b4d082234c04c3805411b437b8396040f522" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "fa836abf72afe9826e866dc25712b7c800323962" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "fa836abf72afe9826e866dc25712b7c800323962" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "1816b4d082234c04c3805411b437b8396040f522" }
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "1742595b5efd3c51720189e00f6a17fa8cf39bb0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
