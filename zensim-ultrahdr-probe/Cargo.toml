[package]
name = "zensim-ultrahdr-probe"
version = "0.1.0"
edition = "2024"
publish = false
description = "Ultra HDR same-base probe: re-encode only the base JPEG, keep the gain map, score the pair in SDR and in HDR (owner question, 2026-11-04)"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"

# Standalone root (listed in ../Cargo.toml's `exclude`): it path-depends on the public zensim checkout
# and on the ultrahdr sibling, which the zensimx workspace must not resolve on bare checkouts.
[workspace]

[dependencies]
# The public crate on the `profile-f` line: `ZensimProfile::F`, `compute`, `compute_hdr`.
zensim = { path = "../../zensim/zensim" }
# Ultra HDR container, gain-map decode and application; the sibling's zenjpeg pin decodes the JPEGs.
ultrahdr-rs = { path = "../../ultrahdr/ultrahdr-rs" }
ultrahdr-core = { path = "../../ultrahdr/ultrahdr-core" }
# The base re-encoder, the same zenjpeg revision ultrahdr-rs bundles (one copy in the graph).
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "4196fa93d422bc367d1e3ddadbaddfe672b9cdfc" }
# Reference metrics on their own paths: SSIMULACRA2's native HDR anchor and butteraugli's linear path.
fast-ssim2 = { version = "0.9.1", features = ["imgref"] }
butteraugli = { version = "0.9.3", features = ["avx512"] }
zenpixels = { version = ">=0.2.16, <0.4.0", default-features = false, features = ["std"] }
rayon = "1.10"
bytemuck = { version = "1", features = ["derive"] }

[patch.crates-io]
# The ultrahdr workspace's pins, replicated so one zenpixels serves ultrahdr, fast-ssim2 and this crate.
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "1d3ddd2131b22e9e3754c765d4ce45ce3901de59" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "1d3ddd2131b22e9e3754c765d4ce45ce3901de59" }
ultrahdr-core = { path = "../../ultrahdr/ultrahdr-core" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "d327434b0826a3e39633665c76f5081c0ceb34cc" }
zencodec-testkit = { git = "https://github.com/imazen/zencodec", rev = "d327434b0826a3e39633665c76f5081c0ceb34cc" }
# zenjpeg wants zenanalyze ^0.2 (git-only until it publishes); the ultrahdr workspace carries the same entry.
zenanalyze = { git = "https://github.com/imazen/zenanalyze", rev = "417cc785b83bee0b3f827ae85c5203f5e104a308" }

[profile.release]
debug = 1
