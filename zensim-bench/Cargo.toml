[package]
name = "zensim-bench"
version = "0.0.0"
edition = "2024"
publish = false


# Standalone workspace root (NOT a member of the zensim root workspace).
# This crate is internal sibling-required tooling: it path-deps crates that
# only exist in the full ~/work/zen dev layout. Excluding it from the root
# workspace keeps `cargo metadata` green on bare checkouts (imazen/zensim#43).
# Build with `cargo <cmd> --manifest-path zensim-bench/Cargo.toml` or from this dir.
[workspace]

[features]
# Quiet-box measurement extension; no serving code or benchmark defaults change.
shipgates = ["dep:zenpng", "zenpng/_dev", "dep:enough", "dep:zenpixels", "dep:zenpixels-convert", "dep:serde_json", "dep:sha2"]
speedq = ["dep:serde_json", "dep:sha2"]
costcmp = ["speedq", "ssim2-rayon", "dep:fast-ssim2-main"]
training = ["zensim/training"]

# `benches/crates_io_speed_bar.rs`: the last crates.io release (0.2.7,
# `PreviewV0_2`) interleaved against the current tree in ONE binary. A
# PRODUCT comparison — the two compute different metrics — plus the one
# like-for-like pair both versions expose, the buffered v1 228-feature
# extraction (`compute_zensim_with_config`, hence `training` on both).
crates-io-0-2-7 = ["dep:zensim027", "training"]

# `benches/ssim2_speed_bar.rs`: turn ON fast-ssim2's optional rayon
# parallelism (it parallelises the Gaussian blur, its dominant kernel).
# A cargo feature is per-BUILD, not per-arm, so the honest way to price
# a threaded opponent is to run that bench twice and read the delta
# against its unchanged `zensim_B` anchor arm.
ssim2-rayon = ["fast-ssim2/rayon"]

# `benches/ssim2_speed_bar.rs` `gmsd` peer arm (gmsd lane, 2026-09-22): the
# zenmetrics libgmsd port, u8 sRGB in, whole call timed like `fast_ssim2`.
# `parallel` = rayon bands (RAYON_NUM_THREADS governs it as it does zensim);
# `avx512` enables its v4 tier. Record: benchmarks/gmsd_2026-09-22.md.
gmsd-arm = ["dep:gmsd", "gmsd/std", "gmsd/parallel", "gmsd/avx512"]

# `examples/m3_fixture_gen.rs`: the IMAZEN owner for the M3/M3a coherence
# fixture grid — zenpng decode/encode + zenresize Mitchell downscale + zenjpeg
# encode. Replaces the ImageMagick shell-out `run_full_eval.sh` used for both
# the size and the quality axis (USER RULE "IMAZEN-ONLY IMAGING/CODEC SOFTWARE",
# 2026-09-02). ERA HAZARD: it does NOT reproduce the ImageMagick-era fixtures —
# see the example's module doc before regenerating anything.
m3-fixtures = ["dep:zenpng", "dep:zenjpeg", "dep:zenresize", "dep:zenpixels", "dep:zenpixels-convert", "dep:enough", "dep:corruption-corpus", "dep:serde_json", "dep:sha2", "dep:zenblend"]
# E5A render-regression lane: fixture twins via m3_fixture_gen `corruption
# render`, per-item scores via `e5a_render_score` (maxabs/psnr/testlin/gmsd/
# zensim_b+diffmap). zen-decode not needed — sources are plain RGB8 PNGs.
# `gmsd/std` is explicit because the shared `gmsd` entry below disables
# default features (see the note there).
e5a-render = ["m3-fixtures", "dep:gmsd", "gmsd/std"]

# Enables the `extract_features_372col_omni` example. As of V11-DECODER-FIX
# (task #195, 2026-05-20) this feature pulls direct zenavif + zenjxl path
# deps so AVIF + JXL encoded variants are decoded natively (previously
# skipped under image-0.25's limited default decoders). Full 4-codec
# coverage: zenjpeg + zenwebp via image crate; zenavif + zenjxl via
# their native crates.
extract-omni = ["training", "dep:parquet", "dep:arrow", "dep:zenavif", "dep:zenjxl", "dep:zenpixels"]

# `verify_bitstream_decode` example: re-decode the stored compressed bitstreams
# through the unified `zencodec` API and compare to the cached `qNN.png`, to
# prove the ~403 GiB PNG decode-cache is regenerable from the ~38 GiB of
# bitstreams. `verify-decode` is JPEG-only (lightest — zenjpeg + zencodec).
# Add per-codec features for the heavier graphs (rav1d / jxl / webp).
# `dep:zenpng` + `dep:enough` are the --decode-list writer (R1b, 2026-08-30):
# the decoded RGB8 goes back out as PNG through the zen encoder so the zensim
# feature extractors (PNG/JPEG readers) can consume avif/jxl/webp corpus rows.
verify-decode = ["dep:zencodec", "dep:zenpixels", "dep:zenjpeg", "zenjpeg/zencodec", "dep:zenpng", "dep:enough", "dep:zenpixels-convert", "dep:zenbitmaps"]
# NB: zenavif's zencodec impls are unconditional (no `zencodec` feature there);
# zenjpeg and zenjxl gate their `*DecoderConfig` types behind their own
# `zencodec` feature, so enable it explicitly. zenwebp's are unconditional
# (re-exported under `zenwebp::zencodec::`).
verify-avif = ["verify-decode", "dep:zenavif"]
verify-jxl = ["verify-decode", "dep:zenjxl", "zenjxl/zencodec"]
verify-webp = ["verify-decode", "dep:zenwebp"]
verify-all = ["verify-avif", "verify-jxl", "verify-webp"]

# THE decode path for the corpus feature extractors (2026-09-04). Pulls every
# codec the shared owner `examples/shared/zen_decode.rs` dispatches to, so a
# corpus row in ANY of the five formats decodes through an imazen decoder —
# notably zenjpeg, which is XYB-aware where the `image` crate is not. An alias
# for `verify-all` rather than a parallel dep list, so the extractor and
# `verify_bitstream_decode` are guaranteed to build the SAME decoders.
zen-decode = ["verify-all", "dep:serde_json", "dep:sha2", "zenpixels-convert/cms-moxcms"]
gmsbank-peer = ["zen-decode", "dep:gmsd"]
# map_dump (research): PNG pairs through the `image` crate, so it builds without the sibling codec checkouts.
map-dump = ["dep:serde_json"]
# map_dump's DVIFM 0.3 judge (the sibling dvifmish checkout; research only).
dvifm-judge = ["map-dump", "dep:dvifmish"]

# Test-only: the fixture ENCODERS for `tests/zen_decode_formats.rs`. The gates
# synthesise their own AVIF / JXL / XYB-JPEG / WebP / PNG fixtures rather than
# reading a corpus, so the suite is self-contained (no network, no /mnt/v, no
# "skip if the file is missing"). Separate from `zen-decode` so the extractor
# build does not pay for encoder graphs it never calls.
zen-decode-tests = ["zen-decode", "zenavif/encode", "zenjxl/encode", "zenjpeg/zencodec", "zenjpeg/__test-utils"]

# joint-core-v1 fresh-leg generator (`examples/core_variant_gen.rs`): decode
# sha-verified png-v3/CLIC sources via the zen-decode owner, render plain
# Mitchell sharpen=0 renditions (zenresize via m3-fixtures), encode through all
# four imazen lossy codecs (zenjpeg + zenwebp + zenavif + zenjxl), decode the
# bitstreams back through the same owner, score ssim2 + butteraugli, and write
# the sha256-keyed provenance rows the dataset manifest consumes.
core-gen = ["zen-decode", "m3-fixtures", "zenavif/encode", "zenjxl/encode"]

# `hdr944_extract` example (SOTA-944 hdr_v3mix amendment): decode the HDR
# datagen's (PQ-PNG ref, .jxl dist) pairs in memory and extract the 944
# folded+append2 HDR-PQ features — no PNG decode-cache on disk.
hdr944-extract = ["dep:zencodec", "dep:zenpng", "dep:enough", "dep:serde_json", "dep:sha2", "dep:zenjxl", "dep:zenpixels", "zensim/feature-regime-v2", "zensim/custom-profiles"]

# `sdr944_extract` example (2026-08-28 era-lessons revisit): local SDR twin of
# hdr944_extract — 944 Folded720Append2 features for arbitrary (ref, dist) PNG
# pairs (identity-check instrument; the fleet's zensim-foldapp2 is jobexec-only).
sdr944-extract = ["dep:png", "zensim/feature-regime-v2"]

[build-dependencies]
cc = "1"

[dependencies]
corruption-corpus = { git = "https://github.com/imazen/codec-corpus", rev = "8e10d4d765667c1c49d74413878fc4bfb46dcf8d", optional = true, default-features = false }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.11", optional = true }
zenblend = { version = "0.1.3", optional = true }
# zenmetrics gmsd crate: GMSD + GMS map for `e5a_render_score` (E5A render
# lane), the `gmsd-arm` speed bench and the `gmsbank_peer_gmsd` C8 peer scorer.
# Path dep mirrors the zenstats entry. TOML allows one `gmsd` key per table, so
# all three share this entry. Default features stay off: without `std`, gmsd's
# final sqrt is its no_std Newton form, and that build produced the stored C8
# peer columns (`/var/tmp/gmsbank/peer_gmsd/`, scorer sha256 2ed8f676…).
# `e5a-render` and `gmsd-arm` enable `gmsd/std` themselves. Enabling either of
# them in the same build as `gmsbank-peer` switches the peer scorer to std sqrt.
gmsd = { path = "../../zenmetrics/crates/gmsd", default-features = false, optional = true }
png = { version = "0.18.1", optional = true }
# zensim-bench is internal tooling (not published).
# `deprecated-profiles` keeps `ZensimProfile::A` available for `zwe_zenbench`,
# which deliberately benchmarks the deprecated generation-A MLP profile.
# `feature-regime-v2` (added 2026-09-01) exposes the streaming fold +
# `V1PoolsMode` that `benches/ssim2_speed_bar.rs`'s amended-W4 arms price.
# It is purely additive (67 `#[cfg]` sites, all on new items), and the
# bench's `zensim_B` anchor arm is the cross-build check that it moved
# nothing.
# `candidate-profiles` added 2026-09-05 (kernel lane): it gates
# `ZensimProfile::D`, the SHIPPED fast-class profile, and without it this bench
# had no arm for the product path at all — every fast-class arm hand-built a
# `V2NewFeatureToggles` and so priced an extraction REGIME while bypassing the
# router (`Zensim::new`'s per-profile engine defaults, `is_fold_backable`'s
# degrade-to-buffered guard, `score_pool_mode`'s derivation from the bake, the
# 372 truncation, the spline). It is one of `zensim`'s DEFAULT features, so
# every real consumer already has it; only this crate's `default-features =
# false` line was hiding it.
zensim = { path = "../zensim", default-features = false, features = ["threads", "avx512", "imgref", "deprecated-profiles", "feature-regime-v2", "candidate-profiles",
# `corruption-head` (2026-09-06): lets `ssim2_speed_bar`'s
# `add156_plus_corrhead` arm price the CURRENT (ZCTH tree) head, not just
# the incumbent ZNPR logistic. The arm sniffs the magic, so both formats
# stay measurable in one binary.
"corruption-head",
# Complete ensemble spatial audits call BakeScorer reference/attribution APIs.
"custom-profiles"] }
# Dedup-K (2026-05-26): profile_compat_report example routes
# spearman/pearson/kendall_tau through canonical zenstats.
zensim027 = { package = "zensim", version = "=0.2.7", optional = true, default-features = false, features = ["avx512", "threads", "training"] }
zenstats = { package = "zenmetrics-stats", path = "../../zenmetrics/crates/zenmetrics-stats", default-features = false, features = ["parallel"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
ssimulacra2 = "0.5"
fast-ssim2 = { version = "=0.8.2", features = ["imgref"] }
# COSTCMP alone prices the fetched main commit; production dependencies stay unchanged.
fast-ssim2-main = { package = "fast-ssim2", git = "https://github.com/imazen/fast-ssim2", rev = "09ec3e7c78bd230b1545572a188e162313c59fda", features = ["imgref", "rayon"], optional = true }
butteraugli = { version = "0.9.3", features = ["avx512"] }
linear-srgb = { version = "0.6.7", default-features = false, features = ["std"] }
imgref = "1.12"
rgb = { version = "0.8", default-features = false, features = ["bytemuck"] }
zenpnm = "0.1"
bytemuck = { version = "1.25", default-features = false, features = ["derive"] }
which = "8"
# Includes the Linux heartbeat gate fix and retained paired timing rounds.
# Registry 0.1.9 cannot export individual observations for latency p95.
zenbench = { git = "https://github.com/imazen/zenbench", rev = "82ff70a3f0c212cf88f53d6e9c3e02de13f32eec" }
# `testable_dispatch` lets benches/tier_isolation.rs disable the baseline SIMD
# token (NEON on aarch64) so the scalar arm is real rather than a second
# measurement of the SIMD path.
archmage = { version = ">=0.9.28, <=0.9.31-beta.1", features = ["std", "testable_dispatch"] }
# Bumped 2026-09-01 to the rev the zensim workspace root pins, so the
# amended-W4 speed arms forward the SHIPPED bakes through the SAME
# runtime that scores them (`caller_input_width` — i.e. dead-column
# pruning — does not exist in the older pin, so a pruned bake could not
# be forwarded at all).
zenpredict = { git = "https://github.com/imazen/zenanalyze", rev = "f0903489300aea240ffae2e3f1359f8f2b9a0ba4" }
# Match the root metadata-splicing owner used by bake_stamp_revision.
zenpredict-bake = { git = "https://github.com/imazen/zenanalyze", rev = "f0903489300aea240ffae2e3f1359f8f2b9a0ba4" }
csv = "1"
dvifmish = { path = "../../../dvifmish", optional = true }
image = "0.25"
rayon = "1.10"

# Optional deps for the `extract-omni` feature.
#
# V11-DECODER-FIX (task #195, 2026-05-20): we replaced `image::open` with
# direct codec path-deps (zenavif + zenjxl), matching the pattern that
# `zensim-target` already uses successfully. This unlocks AVIF + JXL
# decoding for the 372-feature multi-codec extraction (4,000 zenavif
# + 51,200 zenjxl cells previously skipped). The zencodecs unified
# dispatch crate would have been ideal but pulling it as a workspace
# member would require many [patch.crates-io] entries (zenpixels,
# zencodec, zennode, etc.); using the same two AGPL codec crates that
# `zensim-target` already depends on keeps the dependency surface
# minimal while delivering the same 4-codec coverage.
parquet = { version = "58.3.0", default-features = false, features = ["arrow", "zstd"], optional = true }
arrow = { version = "58.3.0", default-features = false, optional = true }
# Direct codec path-deps for V11-DECODER-FIX (AVIF + JXL decode).
# Mirror the path policy used by zensim-target. AGPL-3.0-only OR
# Imazen commercial — zensim-bench is internal-only and not published.
zenavif = { path = "../../zenavif",          optional = true, default-features = false }
zenjxl  = { path = "../../zenjxl",           optional = true, default-features = false, features = ["decode"] }
zenpixels = { version = ">=0.2.10, <0.4.0", default-features = false, optional = true }

# `verify_bitstream_decode` decode path (zencodec unified API).
# zenjpeg is also patched in [patch.crates-io] for transitive consumers; this
# direct optional dep adds the zencodec + decoder features for the JPEG path.
zencodec = { version = ">=0.1.26, <0.3.0", optional = true }
zenjpeg = { path = "../../zenjpeg/zenjpeg", optional = true }
zenwebp = { path = "../../zenwebp", package = "zenwebp", optional = true, default-features = false }
# --decode-list PNG writer (R1b): re-encode the decoded RGB8 so the PNG/JPEG-only
# zensim feature extractors can read avif/jxl/webp corpus rows.
zenpng = { version = "0.1.4", optional = true, default-features = false }
# The canonical pixel-format converter (u16->u8 `v>>8`, gray broadcast, alpha
# drop, channel reorder). Same crate zenmetrics' decode.rs funnels through, so
# a bitstream decoded by --decode-list matches what the fleet extractor saw.
zenpixels-convert = { version = ">=0.2.16, <0.4.0", optional = true }
enough = { version = "0.4", optional = true }
# BMP / PNM / farbfeld through the imazen bitmap codec. Load-bearing, not a
# nicety: TID2013 ships `.BMP` (zensim/CLAUDE.md) and the PIPAL extraction runs
# `extract_features_372col` on BMP, so a decode owner without it would turn two
# real corpora into loud aborts. `zencodec` gives the same trait path the other
# five formats use.
zenbitmaps = { version = "0.1.5", optional = true, default-features = false, features = ["std", "bmp", "zencodec"] }
# `m3_fixture_gen` (the M3/M3a coherence-fixture generator): the imazen owners
# for the size axis (Mitchell downscale) that replaced the ImageMagick shell-out
# in `scripts/run_full_eval.sh` on 2026-09-02, per the IMAZEN-ONLY rule.
zenresize = { version = ">=0.3.1, <0.4.0", optional = true }

[[bench]]
name = "bench_compare"
harness = false

[[bench]]
# The paired ssim2-vs-zensim speed instrument (ssim2-replacement exam).
name = "ssim2_speed_bar"
harness = false

[[bench]]
# What the corruption head's forward pass costs, against the profile forward it
# rides alongside. Separate from `ssim2_speed_bar` because the head is a
# low-single-digit-percent rider on a multi-millisecond extraction, so the
# in-situ arm cannot resolve it; this one removes the extraction entirely.
name = "corrhead_forward"
harness = false

[[bench]]
name = "bench_zensim"
harness = false

[[bench]]
# Last crates.io release vs the current tree, interleaved in one binary.
name = "crates_io_speed_bar"
harness = false
required-features = ["crates-io-0-2-7"]

[[bench]]
name = "tier_isolation"
harness = false

# `extract_features_372col` uses `zensim::{ZensimConfig,
# compute_zensim_with_config}` which are gated behind zensim's `training`
# feature. Declaring `required-features` here lets a plain
# `cargo build --example extract_features_372col` auto-enable it instead
# of failing with unresolved-import errors (the 2026-05-28 build break).
[[example]]
name = "hdr944_extract"
required-features = ["hdr944-extract"]

[[example]]
name = "sdr944_extract"
required-features = ["sdr944-extract"]

# `extract_features_372col` requires `zen-decode` as of 2026-09-04: its decode
# path moved off the `image` crate onto the imazen-only shared owner
# (`examples/shared/zen_decode.rs`). Making the codecs a REQUIRED feature is the
# loud form of the fix — there is no longer a build in which the extractor
# exists but silently cannot read AVIF or JXL.
[[example]]
name = "extract_features_372col"
required-features = ["training", "zen-decode"]

# By-construction exploration: global affine-change descriptor sidecar (research only).
[[example]]
name = "byc_globaff"
required-features = ["zen-decode"]

# By-construction exploration: the decode owner's AVIF projection routes and their pixel hashes (research only).
[[example]]
name = "byc_avif_route"
required-features = ["zen-decode"]

# By-construction exploration: candidate/legacy/judge spatial maps for the map-quality study.
[[example]]
name = "map_dump"
required-features = ["map-dump"]

[[example]]
name = "m3_fixture_gen"
required-features = ["m3-fixtures"]

[[example]]
name = "e5a_render_score"
required-features = ["e5a-render"]

[[example]]
name = "ladder_tile_gen"
required-features = ["m3-fixtures"]

# `aic3_one_pair_smoke` and `extended_iw_perf` likewise use zensim's
# `training`-gated research API; guard them so a default `--all-targets`
# build doesn't try (and fail) to compile them.
[[example]]
name = "aic3_one_pair_smoke"
required-features = ["training"]

[[example]]
name = "extended_iw_perf"
required-features = ["training"]

# `extract_features_372col_omni` pulls the optional sibling codec crates via
# the `extract-omni` feature; gate it so the default build skips it.
[[example]]
name = "extract_features_372col_omni"
required-features = ["extract-omni"]

# `peer_metric_pairs` decodes through the same imazen-only owner, so it carries
# the same REQUIRED feature: there is no build where the peer scorer exists but
# cannot read the corpus it is pointed at.
[[example]]
name = "peer_metric_pairs"
required-features = ["zen-decode"]

[[example]]
name = "gmsbank_decode_dump"
required-features = ["zen-decode"]

[[example]]
name = "gmsbank_peer_gmsd"
required-features = ["gmsbank-peer"]

[[example]]
name = "gmsbank_corpus_fixtures"
required-features = ["zen-decode", "m3-fixtures"]


# `verify_bitstream_decode` needs at least the JPEG decode path (verify-decode).
[[example]]
name = "verify_bitstream_decode"
required-features = ["verify-decode"]

[[example]]
name = "core_variant_gen"
required-features = ["core-gen"]

[[test]]
name = "zen_decode_formats"
required-features = ["zen-decode-tests"]

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(feature, values("training"))', 'cfg(has_cpp_ssimulacra2)', 'cfg(has_cpp_butteraugli)']

# Patches for unpublished crates-io versions required by the sibling codec
# deps (zenjxl wants jxl-encoder 0.4.0 + zenjpeg 0.8.7; max published are
# lower). A dependency's own patch table is ignored — only a workspace
# ROOT's applies, and this crate is now its own root, so declare them here.
[patch.crates-io]
# The current optional WebP source requires the unpublished 0.1.27 codec
# contract. Pin the same source as the JPEG sibling for native audit builds.
zencodec = { git = "https://github.com/imazen/zencodec", rev = "d327434b0826a3e39633665c76f5081c0ceb34cc" }
# NOTE 2026-09-05: this plain path patch was briefly WRONG and is right again.
# `~/work/zen/jxl-encoder` bumped 0.3.2 -> 0.4.0 on 2026-08-29 (`4363a3d5`) while
# the `~/work/zen/zenjxl` checkout still required `^0.3.2` — which was never
# published — so every fresh resolve of this standalone workspace failed and only
# checkouts carrying a warm pre-bump (gitignored) `Cargo.lock` still built. The
# sibling checkout has since advanced to `06a8a94` (zenjxl's own `5e9b8793`,
# 2026-08-30), which requires `^0.4.0` and matches the local crate again. If this
# line ever fails to resolve, check the two siblings' versions against each other
# BEFORE touching anything here.
#
# Re-verified independently 2026-09-05 (a second, later lane hit the same
# already-fixed symptom without noticing this comment, because the git-rev
# stopgap this replaced was gone by then but a stale local `~/work/zen/zenjxl`
# checkout — 8 commits behind — made it LOOK unresolved again): from an empty
# target dir, `cargo update` resolves clean (329 packages); `cargo build -p
# zensim-bench --features training,zen-decode,verify-jxl` and the same with
# `,zenjxl/encode` added (pulls in jxl-encoder itself + zenjxl's encode-gated
# `codec.rs` module) both finish rc=0, zero errors. Full record + proof logs:
# benchmarks/d_inversions_2026-09-05.md §6 addendum.
jxl-encoder = { path = "../../jxl-encoder/jxl-encoder" }
zenjpeg = { path = "../../zenjpeg/zenjpeg" }
# use local sibling codecs so the whole graph resolves to one version (2026-07-18):
# transitive crates.io zenavif/zenpixels were skewing against the local siblings.
# Forcing local unifies them. (zencodec no longer needs a patch: every sibling
# requires the published 0.1.26 taxonomy release — rollout 2026-08-27.)
zenavif = { path = "../../zenavif" }
zenjxl = { path = "../../zenjxl" }
# zenjxl@HEAD consumes the UNPUBLISHED zenjxl-decoder error-taxonomy API
# (jxl::api::ErrorClass) — patch the local sibling in (SOTA-944 hdr944
# amendment; the "patch it in and KEEP WORKING" rule).
zenjxl-decoder = { path = "../../zenjxl-decoder/zenjxl-decoder" }
zenpixels = { path = "../../zenpixels/zenpixels" }
# The unpublished local 0.2.17 narrows u16 to u8 correctly rounded (`round(v / 257)`); registry 0.2.16 does not, and
# moved 4.5% of the safesyn AVIF samples by one level against the stored training root (2026-10-24; see the
# "AVIF decode drift" record in benchmarks/byconstruction_2026-10-22.md). Drop when 0.2.17 is published.
zenpixels-convert = { path = "../../zenpixels/zenpixels-convert" }
# zenjpeg@0.9.0 requires unpublished zenanalyze 0.2.x — dev-only local patch (2026-08-30).
zenanalyze = { path = "../../zenanalyze" }

# Mirror the root workspace build profiles (this is its own workspace root).
[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[[bench]]
name = "stage_isolation"
harness = false

[[example]]
name = "shipgates_judge"
required-features = ["shipgates"]

[[example]]
name = "shipgates_prepare_source"
required-features = ["shipgates"]
