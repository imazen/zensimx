[package]
name = "zensim-workbench"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false
description = "Research: zensim bakes as a zenmetrics workbench module (wasm-bindgen): scores, spatial maps and JPEG XL loop steering maps. Embeds the bakes named at build time; never publish a build that embeds private weights."
build = "build.rs"

# Standalone: not a member of the zensim workspace (its wasm-bindgen pin and
# build-time weights stay out of the library's CI).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zensim = { path = "../zensim", default-features = false, features = ["custom-profiles", "feature-regime-v2"] }
zenpredict = { version = "0.2.0", git = "https://github.com/imazen/zenanalyze", rev = "f0903489300aea240ffae2e3f1359f8f2b9a0ba4" }
serde_json = "1.0.145"
# The zenmetrics workbench pins wasm-bindgen 0.2.129 for its modules; the CLI must match.
wasm-bindgen = "=0.2.129"

[build-dependencies]
sha2 = "0.11.0"

[profile.release]
lto = "thin"
codegen-units = 1
