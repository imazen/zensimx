[package]
name = "zensim-picker-prep"
version = "0.1.0"
edition = "2024"
description = "Per-codec picker training data prep: encode → decode → zensim_Tuner score per (source, codec, q)"
license = "MIT"
publish = false


# Standalone workspace root (NOT a member of the zensim root workspace).
# This crate is internal sibling-required tooling: it path-deps crates that
# only exist in the full ~/work/zen dev layout. Excluding it from the root
# workspace keeps `cargo metadata` green on bare checkouts (imazen/zensimx#43).
# Build with `cargo <cmd> --manifest-path zensim-picker-prep/Cargo.toml` or from this dir.
[workspace]

[dependencies]
zensim = { path = "../zensim", features = ["training"] }
# Experimental trail profiles — the picker sweep scores against the
# PreviewV0_5Tuner trail, now relocated here. Unpublished.
zensim-experimental = { path = "../zensim-experimental" }

# Codec crates — local sibling paths (user directive: no crates.io versions)
# zenjpeg 0.9.0 dropped the `decoder` / `trellis` features (both unconditional now).
zenjpeg = { path = "../../zenjpeg/zenjpeg", default-features = false, features = ["zencodec", "__expert"] }
zenwebp = { path = "../../zenwebp" }
zenavif = { path = "../../zenavif", features = ["encode"] }
zenjxl = { path = "../../zenjxl", features = ["zencodec"] }
zenpng = { path = "../../zenpng" }

# Helper crates the codecs need
zencodec = ">=0.1.26, <0.3.0"
zenpixels = ">=0.2.10, <0.4.0"
zenpixels-convert = ">=0.2.10, <0.4.0"
zenanalyze = { path = "../../zenanalyze" }
almost-enough = "0.4.3"
enough = { version = "0.4.4", default-features = false, features = ["std"] }
imgref = "1"
rgb = "0.8"

# Metric scoring for cross-codec butter sweep
butteraugli = "0.9.2"

# Pipeline + I/O
image = "0.25"
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"

# Parquet output
arrow = { version = "58.3.0", default-features = false }
parquet = { version = "58.3.0", default-features = false, features = ["arrow", "zstd"] }

# Patches for unpublished crates-io versions required by the sibling codec
# deps (zenjxl wants jxl-encoder 0.3.2 + zenjpeg 0.8.7; max published are
# lower). A dependency's own patch table is ignored — only a workspace
# ROOT's applies, and this crate is now its own root, so declare them here.
[patch.crates-io]
jxl-encoder = { path = "../../jxl-encoder/jxl-encoder" }
zenjpeg = { path = "../../zenjpeg/zenjpeg" }
# zenjxl@HEAD requires the UNPUBLISHED zenjxl-decoder 0.4.0 (crates.io max is
# 0.3.x) — patch the local sibling in, same as zensim-bench does.
zenjxl-decoder = { path = "../../zenjxl-decoder/zenjxl-decoder" }

# Mirror the root workspace build profiles (this is its own workspace root).
[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
