[package]
name = "zensim-picker-prep"
version = "0.1.0"
edition = "2024"
description = "Per-codec picker training data prep: encode → decode → zensim_Tuner score per (source, codec, q)"
license = "MIT"
publish = false


# Standalone workspace root (NOT a member of the zensim root workspace).
# Standalone research tooling: external siblings use immutable git revisions.
# In-repository metric crates remain local. Keeping a separate workspace
# avoids pulling codec graphs into ordinary library builds (imazen/zensimx#43).
# Build with `cargo <cmd> --manifest-path zensim-picker-prep/Cargo.toml` or from this dir.
[workspace]

[dependencies]
zensim = { path = "../zensim", features = ["training"] }
# Experimental trail profiles — the picker sweep scores against the
# PreviewV0_5Tuner trail, now relocated here. Unpublished.
zensim-experimental = { path = "../zensim-experimental" }

# Codec crates — immutable git revisions from the qualified cohort.
# zenjpeg 0.9.0 dropped the `decoder` / `trellis` features (both unconditional now).
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "33ef549f0ba8daf1ab2bdce6bf75363807d87636", default-features = false, features = ["zencodec", "__expert"] }
zenwebp = { git = "https://github.com/imazen/zenwebp", rev = "256c056441aeeb5e8cb275d5d5140508f1f54e4f" }
zenavif = { git = "https://github.com/imazen/zenavif", rev = "bf7fdadc95c357571bbd4a245194880912602fd7", features = ["encode"] }
zenjxl = { git = "https://github.com/imazen/zenjxl", rev = "13998d071d77108638aebe7a1c12b4a022ce18dd", features = ["zencodec"] }
zenpng = { git = "https://github.com/imazen/zenpng", rev = "381abd7fc9c753f14d0bd28b4cdd6d36bb1687cf" }

# Helper crates the codecs need
zencodec = ">=0.2.0, <0.3.0"
zenpixels = ">=0.3.1, <0.4.0"
zenpixels-convert = ">=0.3.1, <0.4.0"
zenanalyze = { git = "https://github.com/imazen/zenanalyze", rev = "9f57f1be05e49f91d7a13f5a4bc1227b56fe76f2" }
almost-enough = "0.4.3"
enough = { version = "0.4.4", default-features = false, features = ["std"] }
imgref = "1"
rgb = "0.8"

# Metric scoring for cross-codec butter sweep
butteraugli = "0.9.2"

# Pipeline + I/O
image = "0.25"
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"

# Parquet output
arrow = { version = "58.3.0", default-features = false }
parquet = { version = "58.3.0", default-features = false, features = ["arrow", "zstd"] }

# Patches for unpublished crates-io versions required by the sibling codec
# deps (zenjxl wants jxl-encoder 0.3.2 + zenjpeg 0.8.7; max published are
# lower). A dependency's own patch table is ignored — only a workspace
# ROOT's applies, and this crate is now its own root, so declare them here.
[patch.crates-io]
jxl-encoder = { git = "https://github.com/imazen/jxl-encoder", rev = "7b354ee6b014d334591b1797bd1a3dede4e96331" }
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "33ef549f0ba8daf1ab2bdce6bf75363807d87636" }
# zenjxl@HEAD requires the UNPUBLISHED zenjxl-decoder 0.4.0 (crates.io max is
# 0.3.x) — patch the local sibling in, same as zensim-bench does.
zenjxl-decoder = { git = "https://github.com/imazen/zenjxl-decoder", rev = "b04af24cd154fbefc4081e9072391738b1d7d552" }

# Mirror the root workspace build profiles (this is its own workspace root).
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "fa836abf72afe9826e866dc25712b7c800323962" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "fa836abf72afe9826e866dc25712b7c800323962" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "1816b4d082234c04c3805411b437b8396040f522" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "1816b4d082234c04c3805411b437b8396040f522" }
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "1742595b5efd3c51720189e00f6a17fa8cf39bb0" }
zenpng = { git = "https://github.com/imazen/zenpng", rev = "381abd7fc9c753f14d0bd28b4cdd6d36bb1687cf" }
zenflate = { git = "https://github.com/imazen/zenflate", rev = "a0ea03637a2cc9a193e343018ae2cfb1a6c31edd" }
zenanalyze = { git = "https://github.com/imazen/zenanalyze", rev = "9f57f1be05e49f91d7a13f5a4bc1227b56fe76f2" }
zenavif-serialize = { git = "https://github.com/imazen/zenavif", rev = "bf7fdadc95c357571bbd4a245194880912602fd7" }
butteraugli = { git = "https://github.com/imazen/butteraugli", rev = "554a42f832ceffe7a70303d43f3cddcd5a8cd275" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
