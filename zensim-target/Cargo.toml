[package]
name = "zensim-target"
version = "0.1.0"
edition = "2024"
description = "CLI that picks codec encode params to hit a user-typed zensim target score."
# zensim itself is MIT/Apache, but this crate links AGPL codec dependencies
# (zenjpeg, zenwebp, zenavif, zenjxl, zenpng — all AGPL-3.0-only OR Imazen
# commercial). It is internal-only and not published.
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
publish = false


# Standalone workspace root (NOT a member of the zensim root workspace).
# This crate is internal sibling-required tooling: it path-deps crates that
# only exist in the full ~/work/zen dev layout. Excluding it from the root
# workspace keeps `cargo metadata` green on bare checkouts (imazen/zensimx#43).
# Build with `cargo <cmd> --manifest-path zensim-target/Cargo.toml` or from this dir.
[workspace]

[features]
default = ["zenjpeg", "zenwebp", "zenavif", "zenpng"]
native-probe = ["dep:zenpredict", "dep:serde_json", "dep:sha2", "zensim/custom-profiles"]
# Each codec is opt-in so a build that only needs one doesn't pull the rest.
zenjpeg = ["dep:zenjpeg"]
zenwebp = ["dep:zenwebp"]
zenavif = ["dep:zenavif"]
zenjxl  = ["dep:zenjxl", "dep:zencodec"]
zenpng  = ["dep:zenpng"]

[dependencies]
zenpredict = { version = "0.2.0", git = "https://github.com/imazen/zenanalyze", rev = "f0903489300aea240ffae2e3f1359f8f2b9a0ba4", optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"] }
zensim = { path = "../zensim", features = ["imgref"] }
# Historical/experimental trail profiles (PreviewV0_5* / tuner variants),
# enumerated by the `--profile` CLI parser for evaluation. Unpublished.
zensim-experimental = { path = "../zensim-experimental" }
image = "0.25"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
enough = { version = "0.4.2", default-features = false, features = ["std"] }
almost-enough = "0.4"
rgb = { version = "0.8", default-features = false, features = ["bytemuck"] }
imgref = "1.12"
bytemuck = { version = "1.25", default-features = false, features = ["derive"] }
# zenpixels is needed for AVIF decode (descriptor + buffer accessors).
zenpixels = { version = ">=0.2.10, <0.4.0", default-features = false }

# Codec deps — path refs to sibling worktrees per workspace policy.
# All AGPL-3.0-only OR Imazen commercial.
zenjpeg = { path = "../../zenjpeg/zenjpeg", optional = true, default-features = false }
zenwebp = { path = "../../zenwebp",          optional = true, default-features = false, features = ["std"] }
zenavif = { path = "../../zenavif",          optional = true, default-features = false, features = ["encode"] }
zenjxl  = { path = "../../zenjxl",           optional = true, default-features = false, features = ["encode", "decode", "zencodec"] }
zenpng  = { path = "../../zenpng",           optional = true, default-features = false }
# zencodec traits are needed for the JXL encode path's `EncodeJob` / `Encoder`
# / `EncoderConfig` trait bounds (zenjxl exposes the encoder via these traits
# when the `zencodec` feature is enabled).
zencodec = { version = ">=0.1.26, <0.3.0", optional = true }

[dev-dependencies]
zenpredict = { version = "0.2.0", git = "https://github.com/imazen/zenanalyze", rev = "f0903489300aea240ffae2e3f1359f8f2b9a0ba4" }
fast-ssim2 = { version = "0.8.2", default-features = false, features = ["imgref"] }
serde_json = "1"
sha2 = "0.10"
# CPU butteraugli for the cross-codec smoke test (sibling-worktree path).
butteraugli = { path = "../../../butteraugli/butteraugli", default-features = false }

[[bin]]
name = "zensim-target"
path = "src/bin/zensim_target.rs"

# Patches for unpublished crates-io versions required by the sibling codec
# deps (zenjxl wants jxl-encoder 0.3.2 + zenjpeg 0.8.7; max published are
# lower). A dependency's own patch table is ignored — only a workspace
# ROOT's applies, and this crate is now its own root, so declare them here.
[patch.crates-io]
zenanalyze = { path = "../../zenanalyze" }
zenavif-serialize = { path = "../../zenavif/zenavif-serialize" }
jxl-encoder = { path = "../../jxl-encoder/jxl-encoder" }
zenjpeg = { path = "../../zenjpeg/zenjpeg" }
# zenjxl@HEAD requires the UNPUBLISHED zenjxl-decoder 0.4.0 (crates.io max is
# 0.3.x) — patch the local sibling in, same as zensim-bench does.
zenjxl-decoder = { path = "../../zenjxl-decoder/zenjxl-decoder" }

# Mirror the root workspace build profiles (this is its own workspace root).
[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[[example]]
name = "demo_matrix"
required-features = ["zenpng"]
