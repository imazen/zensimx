[package]
name = "zensim-regress"
version = "0.4.0"
edition = "2024"
description = "Visual regression testing persistence and workflow for zensim"
repository = "https://github.com/imazen/zensimx"
# Research copy: the published crate is released from imazen/zensim (2026-10-28 split).
publish = false
license = "MIT OR Apache-2.0"
rust-version = "1.93.0"
keywords = ["visual", "regression", "testing", "image", "checksum"]
categories = ["development-tools::testing", "multimedia::images"]
exclude = [
    # scratch output — generated by bench_font, not a source file
    "font_results.json",
    # test + bench source: keep declarations intact (see [[bench]]/[[test]]
    # sections below) but omit the source files from the published tarball;
    # downstream users don't need to compile them and this avoids pulling in
    # dev-only fixtures/images.
    "tests/",
    "benches/",
    # images generated by examples at runtime — not source data
    "examples/*.png",
    # internal tooling / CI / workspace-only files
    "tests/fixtures/",
    "CLAUDE.md",
    "CONTEXT-HANDOFF.md",
    "FEEDBACK.md",
    ".claude/",
    ".superwork/",
    ".zenbench/",
    "copter-report/",
    ".github/",
    "Cross.toml",
    "justfile",
    "Cargo.toml.original.txt",
    "fuzz/",
]

[features]
default = ["threads"]
## Forward threading to zensim. Disable for wasm32 or single-threaded use.
threads = ["zensim/threads"]
archmage = ["dep:archmage"]
## INTERNAL — exposes the `layout` module publicly for examples / debug
## tools. Not part of the public API; the underscore prefix signals
## "do not depend on this from outside `zensim-regress`."
_internal_api = []
## PROTOTYPE — render text from the embedded 16.9 KB signed-distance-
## field atlas instead of Mitchell-resampling the 10.8 KB PNG strip.
## Same glyphs/metrics; changes every rendered text pixel (re-baseline
## goldens). Zero additional dependencies. Method + measurements:
## benchmarks/sdf_font_atlas_exploration_2026-07-13.md.
sdf-font = []
## Publicly expose the layout module for the taffy parity harness example.
taffy-backend = ["_internal_api"]

[dependencies]
# Layout solver: the `taffy` CSS flex/grid engine backs `layout::render`
# (RenderConfig::backend, default Taffy). The hand-written native solver
# remains compiled and selectable via `Backend::Native` for A/B. taffy has
# no painting/codecs; default-features off keeps it to flexbox+grid+std.
taffy = { version = "0.12.1", default-features = false, features = ["flexbox", "grid", "std", "taffy_tree"] }
zensim = { workspace = true, default-features = false, features = ["classification", "custom-profiles"] }
archmage = { workspace = true, features = ["testable_dispatch"], optional = true }
# Pixel ops backend — `image`-crate-free. zenresize for resampling,
# zenpng for PNG IO. None of these crates' types appear in the public
# API of zensim-regress (constraint per migration plan, issue #18).
zenresize = { workspace = true }
zenpng = { workspace = true }
zenpixels = { workspace = true }
# Linear-light premultiplied f32 compositing (Porter-Duff src-over). Used
# internally by pixel_ops::overlay / fill_rect / draw_rect_border for
# partial-alpha blending — fixes the under-darkening artifact you get
# from blending sRGB-encoded straight-alpha values directly.
zenblend = { workspace = true }
enough = { workspace = true }
imgref = { workspace = true }
rgb = { workspace = true }
bytemuck = { workspace = true }
# Used internally for gamma-correct text blending in `font::*` and
# the linear-premul conversion path in `pixel_ops::*`. Not exposed in
# the public API (the `no-leakage` CI guard verifies).
linear-srgb = { workspace = true }
seahash = "4.1.0"
thiserror = { workspace = true }
base64 = "0.22.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fs2 = "0.4.3"

[dev-dependencies]
tempfile = "3.27.0"
archmage = { workspace = true, features = ["testable_dispatch"] }
codec-corpus = { workspace = true }
zenbench = { workspace = true }
# `image` is a dev-only convenience for tests/benches/examples. It is NOT
# allowed in the runtime crate (would leak into the public API surface and
# create version-coalescing fragility for downstream users). See CI check
# in `.github/workflows/ci.yml` — `no-image-in-runtime`.
image = { workspace = true }
# codec-corpus-fetch is local-only; uncomment for real_images tests
# codec-corpus-fetch = { path = "/home/lilith/work/codec-corpus-fetch" }

# Ad-hoc image-diff CLI (issue #14) — wraps the diff_image primitives.
[[bin]]
name = "zensim-diff"
path = "src/bin/diff.rs"

[[bench]]
name = "bench_mismatch"
harness = false

[[bench]]
name = "bench_color_diffmap"
harness = false

[[bench]]
name = "bench_font"
harness = false

# Layout-module gallery — requires the internal-API feature flag because
# the layout module is private by default.
[[example]]
name = "layout_gallery"
required-features = ["_internal_api"]

# Syntax comparison: fluent / macros / closure-builder side-by-side.
[[example]]
name = "syntax_comparison"
required-features = ["_internal_api"]

[[example]]
name = "glyph_batch_bench"
required-features = ["_internal_api"]

# Taffy-vs-native backend parity harness (needs the public layout module).
[[example]]
name = "taffy_parity"
required-features = ["taffy-backend"]
